; Telephony PoC (docs/TELEPHONY_VOICE_AI.md, Faza 1) — one test SIP extension
; for a softphone (Zoiper/Linphone) to register against and dial the demo
; appeal line. Not for production: single hardcoded password, no TLS/SRTP.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Test extension 1000: register a softphone with these credentials ---
[1000]
type=endpoint
context=appeal-demo
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=1000-auth
aors=1000
direct_media=no

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=changeme_demo_password

[1000]
type=aor
max_contacts=1
